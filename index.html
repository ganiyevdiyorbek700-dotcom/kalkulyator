<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AniPix.Uz</title>
    
    <!-- Firebase Kutubxonalari -->
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>

    <style>
        body {
            background-color: #0f0f0f;
            color: #ffffff;
            font-family: 'Arial', sans-serif;
            padding: 15px;
            margin: 0;
        }

        /* 1 Soniyalik Loading Screen */
        #loading-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: #0f0f0f;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 9999;
            transition: opacity 0.4s ease;
        }
        .spinner {
            width: 45px;
            height: 45px;
            border: 4px solid rgba(0, 255, 204, 0.2);
            border-top: 4px solid #00ffcc;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin-bottom: 15px;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        .load-title {
            color: #00ffcc;
            font-size: 22px;
            font-weight: bold;
        }

        h2 {
            text-align: center;
            color: #00ffcc;
            margin-bottom: 12px;
        }

        .search-box {
            width: 100%;
            padding: 12px 15px;
            margin-bottom: 12px;
            background-color: #1a1a1a;
            border: 1px solid #333;
            border-radius: 8px;
            color: #fff;
            font-size: 15px;
            box-sizing: border-box;
            outline: none;
        }
        .search-box:focus {
            border-color: #0088cc;
        }

        /* Janrlar filtri paneli */
        .filter-container {
            display: flex;
            gap: 8px;
            overflow-x: auto;
            padding-bottom: 12px;
            margin-bottom: 15px;
            scrollbar-width: none;
        }
        .filter-container::-webkit-scrollbar {
            display: none;
        }
        .filter-chip {
            background-color: #1a1a1a;
            color: #aaa;
            border: 1px solid #333;
            padding: 8px 14px;
            border-radius: 20px;
            font-size: 13px;
            white-space: nowrap;
            cursor: pointer;
            transition: all 0.2s ease;
        }
        .filter-chip.active {
            background-color: #0088cc;
            color: #fff;
            border-color: #0088cc;
        }

        /* Anime kartochkasi dizayni */
        .anime-card {
            background: #1a1a1a;
            border-radius: 12px;
            padding: 15px;
            margin-bottom: 15px;
            border-left: 5px solid #0088cc;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        .btn {
            display: block;
            width: 100%;
            background-color: #0088cc;
            color: white;
            text-align: center;
            padding: 10px;
            border-radius: 8px;
            text-decoration: none;
            font-weight: bold;
            border: none;
            cursor: pointer;
            font-size: 14px;
        }
        .btn:active {
            background-color: #006699;
        }

        /* Statistika va Interaktiv tugmalar */
        .card-actions {
            display: flex;
            justify-content: space-around;
            align-items: center;
            border-top: 1px solid #2a2a2a;
            padding-top: 10px;
            font-size: 13px;
            color: #aaa;
            width: 100%;
        }
        .action-btn {
            background: none;
            border: none;
            color: #aaa;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 5px;
            font-size: 13px;
            transition: color 0.2s;
        }
        .action-btn:hover {
            color: #fff;
        }

        /* Kommentariya qismi */
        .comments-section {
            display: none;
            margin-top: 10px;
            border-top: 1px dashed #333;
            padding-top: 10px;
            width: 100%;
        }
        .comments-section.active {
            display: block;
        }
        .comment-input-box {
            display: flex;
            gap: 8px;
            margin-bottom: 10px;
        }
        .comment-input {
            flex-grow: 1;
            background: #252525;
            border: 1px solid #444;
            border-radius: 6px;
            padding: 6px 10px;
            color: #fff;
            font-size: 12px;
            outline: none;
        }
        .comment-send-btn {
            background: #0088cc;
            color: white;
            border: none;
            padding: 6px 12px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 12px;
            font-weight: bold;
        }
        .comment-list {
            max-height: 120px;
            overflow-y: auto;
            font-size: 12px;
            display: flex;
            flex-direction: column;
            gap: 5px;
        }
        .comment-item {
            background: #222;
            padding: 6px 8px;
            border-radius: 6px;
            color: #ddd;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .loading {
            text-align: center;
            color: #aaa;
            margin-top: 20px;
        }
    </style>
</head>
<body>

    <!-- 1 Soniyalik Loading Screen -->
    <div id="loading-screen">
        <div class="spinner"></div>
        <div class="load-title">🎬 AniPix.Uz</div>
    </div>

    <h2>🎬 AniPix.Uz</h2>

    <!-- Qidiruv paneli -->
    <input type="text" id="searchInput" class="search-box" placeholder="Anime qidirish..." onkeyup="filterAnimes()">

    <!-- 15 ta Janr filtrlari -->
    <div class="filter-container" id="genreFilters">
        <button class="filter-chip active" onclick="setGenre('barchasi', this)">Barchasi</button>
        <button class="filter-chip" onclick="setGenre('jangari', this)">Jangari</button>
        <button class="filter-chip" onclick="setGenre('fantastika', this)">Fantastika</button>
        <button class="filter-chip" onclick="setGenre('romantika', this)">Romantika</button>
        <button class="filter-chip" onclick="setGenre('drama', this)">Drama</button>
        <button class="filter-chip" onclick="setGenre('sport', this)">Sport</button>
        <button class="filter-chip" onclick="setGenre('sarguzasht', this)">Sarguzasht</button>
        <button class="filter-chip" onclick="setGenre('komediya', this)">Komediya</button>
        <button class="filter-chip" onclick="setGenre('triller', this)">Triller</button>
        <button class="filter-chip" onclick="setGenre('sirli', this)">Sirli</button>
        <button class="filter-chip" onclick="setGenre('psixologik', this)">Psixologik</button>
        <button class="filter-chip" onclick="setGenre('tarixiy', this)">Tarixiy</button>
        <button class="filter-chip" onclick="setGenre('hayotiy', this)">Hayotiy</button>
        <button class="filter-chip" onclick="setGenre('fantaziya', this)">Fantaziya</button>
        <button class="filter-chip" onclick="setGenre('urush', this)">Urush</button>
    </div>

    <div id="animeList">
        <div class="loading">Ma'lumotlar yuklanmoqda...</div>
    </div>

    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script>
        let tg = window.Telegram.WebApp;
        tg.expand();

        // 1 soniyadan keyin Loading Screen'ni yashirish
        setTimeout(() => {
            let loader = document.getElementById('loading-screen');
            loader.style.opacity = '0';
            setTimeout(() => {
                loader.style.display = 'none';
            }, 300);
        }, 1000);

        // Firebase Ulanishi
        const firebaseConfig = {
            databaseURL: "https://anipix-c13c5-default-rtdb.firebaseio.com/"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        const sheetUrl = 'https://docs.google.com/spreadsheets/d/11sQ6ue-cF8xzAqRSjaiyEJ-tnQj2kfg_wlD2PC7FiwA/export?format=csv';
        let allAnimes = [];
        let selectedGenre = 'barchasi';

        async function loadAnime() {
            try {
                let response = await fetch(sheetUrl);
                let data = await response.text();
                parseCSV(data);
            } catch (error) {
                document.getElementById('animeList').innerHTML = '<div class="loading" style="color:red;">Maʼlumotlarni yuklashda xatolik yuz berdi!</div>';
            }
        }

        function parseCSV(text) {
            let rows = text.split('\n');
            allAnimes = [];

            for (let i = 1; i < rows.length; i++) {
                let row = rows[i].trim();
                if (!row) continue;
                
                let cols = row.split(/,(?=(?:(?:[^"]*"){2})*[^"]*$)/);
                if (cols.length >= 5) {
                    let id = 'anime_' + i;
                    let nomi = cols[0] ? cols[0].replace(/^"(.*)"$/, '$1').trim() : '';
                    let janri = cols[1] ? cols[1].replace(/^"(.*)"$/, '$1').trim() : '';
                    let tili = cols[2] ? cols[2].replace(/^"(.*)"$/, '$1').trim() : '';
                    let havola = cols[3] ? cols[3].replace(/^"(.*)"$/, '$1').trim() : '';
                    let poster = cols[4] ? cols[4].replace(/^"(.*)"$/, '$1').trim() : 'https://via.placeholder.com/300x450?text=AniPix';

                    if (nomi) {
                        allAnimes.push({ id, nomi, janri, tili, havola, poster, likes: 0, views: 0, comments: [] });
                    }
                }
            }
            // Jadval o'qib bo'lingach, Firebase'dan ma'lumotlarni tortib kelamiz
            loadAnimeDataFromFirebase();
        }

        // Firebase'dan layk, ko'rish va kommentlarni real vaqtda olish
        function loadAnimeDataFromFirebase() {
            db.ref('animes').on('value', (snapshot) => {
                let data = snapshot.val() || {};
                
                allAnimes.forEach(anime => {
                    let animeData = data[anime.id] || {};
                    anime.likes = animeData.likes || 0;
                    anime.views = animeData.views || 0;
                    
                    let commentsObj = animeData.comments || {};
                    anime.comments = Object.entries(commentsObj).map(([key, val]) => ({
                        key: key,
                        text: typeof val === 'object' ? val.text : val
                    }));
                });

                filterAnimes();
            });
        }

        function displayAnimes(list) {
            let listContainer = document.getElementById('animeList');
            listContainer.innerHTML = '';

            if (list.length === 0) {
                listContainer.innerHTML = '<div class="loading">Hech narsa topilmadi</div>';
                return;
            }

            list.forEach(anime => {
                let card = document.createElement('div');
                card.className = 'anime-card';
                card.style.cssText = "display: flex; flex-direction: column; align-items: center; text-align: center; padding: 15px;";
                
                card.innerHTML = `
                    <img src="${anime.poster}" alt="${anime.nomi}" style="width: 100%; max-width: 300px; height: auto; aspect-ratio: 2/3; object-fit: cover; border-radius: 12px; margin-bottom: 15px; box-shadow: 0 8px 20px rgba(0,0,0,0.8);" onerror="this.src='https://via.placeholder.com/300x450?text=AniPix'">
                    
                    <h3 style="margin: 5px 0 8px 0; font-size: 19px; color: #fff;">${anime.nomi}</h3>
                    <div style="font-size: 13px; color: #aaa; margin-bottom: 3px;">Janr: ${anime.janri}</div>
                    <div style="font-size: 13px; color: #aaa; margin-bottom: 15px;">Til: ${anime.tili}</div>

                    <button class="btn" style="width: 100%; margin-bottom: 12px; padding: 10px;" onclick="animeKorish('${anime.havola}', '${anime.id}')">Ko'rish</button>
                    
                    <div class="card-actions">
                        <button class="action-btn" onclick="toggleLike('${anime.id}')">
                            ❤️ <span>${anime.likes}</span>
                        </button>
                        <button class="action-btn">
                            👁️ <span>${anime.views}</span>
                        </button>
                        <button class="action-btn" onclick="toggleComments('${anime.id}')">
                            💬 Fikrlar (${anime.comments.length})
                        </button>
                    </div>

                    <div class="comments-section" id="comments_${anime.id}">
                        <div class="comment-input-box">
                            <input type="text" class="comment-input" id="input_${anime.id}" placeholder="Fikr bildiring...">
                            <button class="comment-send-btn" onclick="addComment('${anime.id}')">Yo'llash</button>
                        </div>
                        <div class="comment-list" id="list_${anime.id}">
                            ${anime.comments.length === 0 ? '<div style="color:#777; text-align:center;">Hali fikrlar yo\'q</div>' : ''}
                            ${anime.comments.map(c => `
                                <div class="comment-item">
                                    <span style="word-break: break-all; padding-right: 10px; text-align: left;">${c.text}</span>
                                    <button onclick="deleteComment('${anime.id}', '${c.key}')" style="background: none; border: none; cursor: pointer; font-size: 14px;" title="O'chirish">🗑️</button>
                                </div>
                            `).join('')}
                        </div>
                    </div>
                `;
                listContainer.appendChild(card);
            });
        }

        // Ko'rish tugmasi bosilganda hisoblagichni bazada oshirish
        function animeKorish(telegramUrl, id) {
            let viewRef = db.ref('animes/' + id + '/views');
            viewRef.transaction(currentViews => (currentViews || 0) + 1);

            let monetagLink = 'https://omg10.com/4/11584274'; 
            window.open(monetagLink, '_blank');
            setTimeout(() => {
                window.location.href = telegramUrl;
            }, 1000);
        }

        // Layk bosish (Baza orqali umumiy)
        function toggleLike(id) {
            let likeRef = db.ref('animes/' + id + '/likes');
            likeRef.transaction(currentLikes => (currentLikes || 0) + 1);
        }

        // Kommentariya panelini ochib-yopish
        function toggleComments(id) {
            let section = document.getElementById(`comments_${id}`);
            section.classList.toggle('active');
        }

        // Kommentariya qo'shish (Bazaga yuborish)
        function addComment(id) {
            let input = document.getElementById(`input_${id}`);
            let text = input.value.trim();
            if (!text) return;

            let commentsRef = db.ref('animes/' + id + '/comments');
            commentsRef.push(text);
            input.value = '';
        }

        // Kommentariyani o'chirish
        function deleteComment(animeId, commentKey) {
            db.ref('animes/' + animeId + '/comments/' + commentKey).remove();
        }

        function setGenre(genre, element) {
            selectedGenre = genre;
            document.querySelectorAll('.filter-chip').forEach(chip => chip.classList.remove('active'));
            element.classList.add('active');
            filterAnimes();
        }

        function filterAnimes() {
            let query = document.getElementById('searchInput').value.toLowerCase();
            
            let filtered = allAnimes.filter(anime => {
                let matchesSearch = anime.nomi.toLowerCase().includes(query) || anime.janri.toLowerCase().includes(query);
                let matchesGenre = selectedGenre === 'barchasi' || anime.janri.toLowerCase().includes(selectedGenre);
                return matchesSearch && matchesGenre;
            });

            displayAnimes(filtered);
        }

        loadAnime();
    </script>
</body>
</html>
