<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AniPix.Uz</title>
    <style>
        body {
            background-color: #0f0f0f;
            color: #ffffff;
            font-family: 'Arial', sans-serif;
            padding: 20px;
            margin: 0;
        }
        h2 {
            text-align: center;
            color: #00ffcc;
            margin-bottom: 25px;
        }
        .anime-card {
            background: #1a1a1a;
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 15px;
            border-left: 5px solid #0088cc; /* Yonidan chiroyli chiziq */
        }
        .anime-card h3 {
            margin: 0 0 10px 0;
            color: #fff;
        }
        .anime-info {
            color: #aaa;
            font-size: 14px;
            margin-bottom: 15px;
        }
        .btn {
            display: block;
            width: 100%;
            background-color: #0088cc;
            color: white;
            text-align: center;
            padding: 12px;
            border-radius: 8px;
            text-decoration: none;
            font-weight: bold;
            border: none;
            cursor: pointer;
        }
        .btn:active {
            background-color: #006699;
        }
    </style>
</head>
<body>

    <h2>🎬 AniPix.Uz</h2>

    <!-- Anime 1 -->
    <div class="anime-card">
        <h3>Solo Leveling</h3>
        <div class="anime-info">Janr: Jangari, Fantastika <br> Til: O'zbekcha</div>
        <button class="btn" onclick="animeKorish('https://t.me/animelarnN1')">Ko'rish</button>
    </div>

    <!-- Anime 2 -->
    <div class="anime-card">
        <h3>Hujum Korpusi (Attack on Titan)</h3>
        <div class="anime-info">Janr: Fentezi, Drama <br> Til: O'zbekcha</div>
        <button class="btn" onclick="animeKorish('https://t.me/animelarnN1')">Ko'rish</button>
    </div>

    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script>
        let tg = window.Telegram.WebApp;
        tg.expand();

        function animeKorish(url) {
            // Reklama uchun joy (Monetag skriptini shu yerga qo'shasiz)
            alert("Reklama yuklanmoqda..."); 
            setTimeout(() => {
                window.open(url, '_blank');
            }, 1000);
        }
    </script>
</body>
</html>
