<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AniPix.Uz</title>
    
    <!-- Firebase Kutubxonalari -->
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>

    <style>
        :root {
            --bg-color: #0b0914;
            --card-bg: #151122;
            --accent: #ff007f;
            --accent-blue: #00f0ff;
            --text-main: #ffffff;
            --text-muted: #9491a1;
            --border: #2a2342;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            padding: 12px;
            margin: 0;
        }

        .header-box {
            text-align: center;
            margin-bottom: 15px;
        }

        h2 {
            color: var(--accent);
            margin: 0 0 5px 0;
            font-size: 24px;
            letter-spacing: 1px;
            text-shadow: 0 0 10px rgba(255, 0, 127, 0.4);
        }

        /* Admin Panel Stili */
        #adminPanel {
            display: none;
            background: linear-gradient(135deg, #1f1435, #2b1238);
            border: 1px solid var(--accent);
            border-radius: 10px;
            padding: 10px;
            margin-bottom: 15px;
            text-align: center;
            font-size: 13px;
            box-shadow: 0 0 15px rgba(255, 0, 127, 0.2);
        }
        #adminPanel span {
            color: var(--accent-blue);
            font-weight: bold;
        }

        .search-box {
            width: 100%;
            padding: 10px 14px;
            margin-bottom: 12px;
            background-color: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 10px;
            color: #fff;
            font-size: 14px;
            box-sizing: border-box;
            outline: none;
            transition: all 0.3s;
        }
        .search-box:focus {
            border-color: var(--accent-blue);
            box-shadow: 0 0 8px rgba(0, 240, 255, 0.3);
        }

        /* Janrlar filtri paneli */
        .filter-container {
            display: flex;
            gap: 6px;
            overflow-x: auto;
            padding-bottom: 8px;
            margin-bottom: 12px;
            scrollbar-width: none;
        }
        .filter-container::-webkit-scrollbar {
            display: none;
        }
        .filter-chip {
            background-color: var(--card-bg);
            color: var(--text-muted);
            border: 1px solid var(--border);
            padding: 6px 12px;
            border-radius: 16px;
            font-size: 12px;
            white-space: nowrap;
            cursor: pointer;
            transition: all 0.2s ease;
        }
        .filter-chip.active {
            background-color: var(--accent);
            color: #fff;
            border-color: var(--accent);
            box-shadow: 0 0 10px rgba(255, 0, 127, 0.5);
        }

        /* Anime grid yoki list ixcham dizayn */
        #animeList {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 10px;
        }

        .anime-card {
            background: var(--card-bg);
            border-radius: 12px;
            padding: 10px;
            border: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            position: relative;
            overflow: hidden;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
        }

        .anime-poster-box {
            width: 100%;
            aspect-ratio: 2/3;
            border-radius: 8px;
            overflow: hidden;
            margin-bottom: 8px;
            background: #000;
        }

        .anime-poster-box img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.3s;
        }
        .anime-card:hover img {
            transform: scale(1.03);
        }

        .anime-title {
            font-size: 13px;
            font-weight: bold;
            color: #fff;
            margin: 0 0 4px 0;
            display: -webkit-box;
            -webkit-line-clamp: 1;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        .anime-info {
            font-size: 11px;
            color: var(--text-muted);
            margin-bottom: 8px;
        }

        .btn {
            display: block;
            width: 100%;
            background: linear-gradient(135deg, var(--accent-blue), #0088cc);
            color: white;
            text-align: center;
            padding: 7px;
            border-radius: 6px;
            text-decoration: none;
            font-weight: bold;
            border: none;
            cursor: pointer;
            font-size: 12px;
            margin-bottom: 8px;
        }
        .btn:active {
            opacity: 0.8;
        }

        /* Statistika va Interaktiv tugmalar */
        .card-actions {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-top: 1px solid var(--border);
            padding-top: 6px;
            font-size: 11px;
            color: var(--text-muted);
        }
        .action-btn {
            background: none;
            border: none;
            color: var(--text-muted);
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 3px;
            font-size: 11px;
            transition: color 0.2s;
        }
        .action-btn.liked {
            color: var(--accent);
        }
        .action-btn:hover {
            color: #fff;
        }

        /* Kommentariya qismi (Modal yoki oyna ostida) */
        .comments-section {
            display: none;
            grid-column: span 2;
            background: #110d1c;
            margin-top: 5px;
            border: 1px dashed var(--border);
            border-radius: 8px;
            padding: 8px;
        }
        .comments-section.active {
            display: block;
        }
        .comment-input-box {
            display: flex;
            gap: 5px;
            margin-bottom: 6px;
        }
        .comment-input {
            flex-grow: 1;
            background: #1a1528;
            border: 1px solid var(--border);
            border-radius: 5px;
            padding: 5px 8px;
            color: #fff;
            font-size: 11px;
            outline: none;
        }
        .comment-send-btn {
            background: var(--accent);
            color: white;
            border: none;
            padding: 5px 10px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 11px;
            font-weight: bold;
        }
        .comment-list {
            max-height: 100px;
            overflow-y: auto;
            font-size: 11px;
            display: flex;
            flex-direction: column;
            gap: 4px;
        }
        .comment-item {
            background: #1a1528;
            padding: 5px 6px;
            border-radius: 5px;
            color: #ddd;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .loading {
            grid-column: span 2;
            text-align: center;
            color: var(--text-muted);
            margin-top: 20px;
            font-size: 13px;
        }
    </style>
</head>
<body>

    <div class="header-box">
        <h2>⚡ AniPix.Uz</h2>
    </div>

    <!-- Admin Panel (Faqat egasiga ko'rinadi) -->
    <div id="adminPanel">
        👑 <b>Admin Panel:</b> Botga kirgan jami foydalanuvchilar: <span id="totalUsersCount">0</span> ta
    </div>

    <!-- Qidiruv paneli -->
    <input type="text" id="searchInput" class="search-box" placeholder="🔍 Anime qidirish..." onkeyup="filterAnimes()">

    <!-- 15 ta Janr filtrlari -->
    <div class="filter-container" id="genreFilters">
        <button class="filter-chip active" onclick="setGenre('barchasi', this)">Barchasi</button>
        <button class="filter-chip" onclick="setGenre('jangari', this)">Jangari</button>
        <button class="filter-chip" onclick="setGenre('fantastika', this)">Fantastika</button>
        <button class="filter-chip" onclick="setGenre('romantika', this)">Romantika</button>
        <button class="filter-chip" onclick="setGenre('drama', this)">Drama</button>
        <button class="filter-chip" onclick="setGenre('sport', this)">Sport</button>
        <button class="filter-chip" onclick="setGenre('sarguzasht', this)">Sarguzasht</button>
        <button class="filter-chip" onclick="setGenre('komediya', this)">Komediya</button>
        <button class="filter-chip" onclick="setGenre('triller', this)">Triller</button>
        <button class="filter-chip" onclick="setGenre('sirli', this)">Sirli</button>
        <button class="filter-chip" onclick="setGenre('psixologik', this)">Psixologik</button>
        <button class="filter-chip" onclick="setGenre('tarixiy', this)">Tarixiy</button>
        <button class="filter-chip" onclick="setGenre('hayotiy', this)">Hayotiy</button>
        <button class="filter-chip" onclick="setGenre('fantaziya', this)">Fantaziya</button>
        <button class="filter-chip" onclick="setGenre('urush', this)">Urush</button>
    </div>

    <div id="animeList">
        <div class="loading">Yuklanmoqda...</div>
    </div>

    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script>
        let tg = window.Telegram.WebApp;
        tg.expand();

        let currentUserId = tg.initDataUnsafe?.user?.id;
        if (!currentUserId) {
            currentUserId = localStorage.getItem('device_user_id');
            if (!currentUserId) {
                currentUserId = 'user_' + Math.random().toString(36).substring(2);
                localStorage.setItem('device_user_id', currentUserId);
            }
        }

        const ADMIN_ID = 7790655978;

        // Firebase Ulanishi
        const firebaseConfig = {
            databaseURL: "https://anipix-c13c5-default-rtdb.firebaseio.com/"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        // Foydalanuvchini bazada ro'yxatdan o'tkazish (Statistika uchun)
        function registerUserInDatabase() {
            if (currentUserId) {
                let userRef = db.ref('users/' + currentUserId);
                userRef.set({
                    lastActive: Date.now(),
                    username: tg.initDataUnsafe?.user?.username || 'Nomaʼlum',
                    name: tg.initDataUnsafe?.user?.first_name || 'Foydalanuvchi'
                });
            }
        }
        registerUserInDatabase();

        // Agar admin bo'lsa, panelni chiqarish va sonini hisoblash
        if (String(currentUserId) === String(ADMIN_ID)) {
            document.getElementById('adminPanel').style.display = 'block';
            db.ref('users').on('value', snapshot => {
                let usersData = snapshot.val() || {};
                let count = Object.keys(usersData).length;
                document.getElementById('totalUsersCount').innerText = count;
            });
        }

        const sheetUrl = 'https://docs.google.com/spreadsheets/d/11sQ6ue-cF8xzAqRSjaiyEJ-tnQj2kfg_wlD2PC7FiwA/export?format=csv';
        let allAnimes = [];
        let selectedGenre = 'barchasi';

        async function loadAnime() {
            try {
                let response = await fetch(sheetUrl);
                let data = await response.text();
                parseCSV(data);
            } catch (error) {
                console.error("Xatolik:", error);
                document.getElementById('animeList').innerHTML = '<div class="loading" style="color:var(--accent);">Xatolik yuz berdi!</div>';
            }
        }

        function parseCSV(text) {
            let rows = text.split('\n');
            allAnimes = [];

            for (let i = 1; i < rows.length; i++) {
                let row = rows[i].trim();
                if (!row) continue;
                
                let cols = row.split(/,(?=(?:(?:[^"]*"){2})*[^"]*$)/);
                if (cols.length >= 5) {
                    let id = 'anime_' + i;
                    let nomi = cols[0] ? cols[0].replace(/^"(.*)"$/, '$1').trim() : '';
                    let janri = cols[1] ? cols[1].replace(/^"(.*)"$/, '$1').trim() : '';
                    let tili = cols[2] ? cols[2].replace(/^"(.*)"$/, '$1').trim() : '';
                    let havola = cols[3] ? cols[3].replace(/^"(.*)"$/, '$1').trim() : '';
                    let poster = cols[4] ? cols[4].replace(/^"(.*)"$/, '$1').trim() : 'https://via.placeholder.com/300x450?text=AniPix';

                    if (nomi) {
                        allAnimes.push({ id, nomi, janri, tili, havola, poster, likes: 0, views: 0, comments: [], likedUsers: {} });
                    }
                }
            }
            loadAnimeDataFromFirebase();
        }

        function loadAnimeDataFromFirebase() {
            db.ref('animes').on('value', (snapshot) => {
                let data = snapshot.val() || {};
                
                allAnimes.forEach(anime => {
                    let animeData = data[anime.id] || {};
                    anime.likes = animeData.likes || 0;
                    anime.views = animeData.views || 0;
                    anime.likedUsers = animeData.likedUsers || {};
                    
                    let commentsObj = animeData.comments || {};
                    anime.comments = Object.entries(commentsObj).map(([key, val]) => ({
                        key: key,
                        text: typeof val === 'object' ? val.text : val,
                        userId: typeof val === 'object' ? val.userId : null,
                        userName: typeof val === 'object' ? val.userName : 'Foydalanuvchi'
                    }));
                });

                filterAnimes();
            });
        }

        function displayAnimes(list) {
            let listContainer = document.getElementById('animeList');
            listContainer.innerHTML = '';

            if (list.length === 0) {
                listContainer.innerHTML = '<div class="loading">Hech narsa topilmadi</div>';
                return;
            }

            list.forEach(anime => {
                let card = document.createElement('div');
                card.className = 'anime-card';
                
                let isLikedByMe = anime.likedUsers && anime.likedUsers[currentUserId];

                card.innerHTML = `
                    <div>
                        <div class="anime-poster-box">
                            <img src="${anime.poster}" alt="${anime.nomi}" onerror="this.src='https://via.placeholder.com/300x450?text=AniPix'">
                        </div>
                        <div class="anime-title" title="${anime.nomi}">${anime.nomi}</div>
                        <div class="anime-info">Janr: ${anime.janri}</div>
                    </div>

                    <div>
                        <button class="btn" onclick="animeKorish('${anime.havola}', '${anime.id}')">Ko'rish</button>
                        
                        <div class="card-actions">
                            <button class="action-btn ${isLikedByMe ? 'liked' : ''}" onclick="toggleLike('${anime.id}')">
                                ❤️ <span>${anime.likes}</span>
                            </button>
                            <button class="action-btn">
                                👁️ <span>${anime.views}</span>
                            </button>
                            <button class="action-btn" onclick="toggleComments('${anime.id}')">
                                💬 (${anime.comments.length})
                            </button>
                        </div>
                    </div>

                    <div class="comments-section" id="comments_${anime.id}">
                        <div class="comment-input-box">
                            <input type="text" class="comment-input" id="input_${anime.id}" placeholder="Fikr yozing...">
                            <button class="comment-send-btn" onclick="addComment('${anime.id}')">Yo'llash</button>
                        </div>
                        <div class="comment-list" id="list_${anime.id}">
                            ${anime.comments.length === 0 ? '<div style="color:#777; text-align:center;">Fikrlar yo\'q</div>' : ''}
                            ${anime.comments.map(c => {
                                let canDelete = (String(c.userId) === String(currentUserId) || String(currentUserId) === String(ADMIN_ID));
                                return `
                                    <div class="comment-item">
                                        <div style="text-align: left; width: 100%; overflow:hidden;">
                                            <span style="font-size: 10px; color: var(--accent-blue); display: block;">${c.userName}</span>
                                            <span style="word-break: break-all; color: #ddd; font-size:10px;">${c.text}</span>
                                        </div>
                                        ${canDelete ? `<button onclick="deleteComment('${anime.id}', '${c.key}')" style="background: none; border: none; cursor: pointer; font-size: 12px; margin-left: 3px;" title="O'chirish">🗑️</button>` : ''}
                                    </div>
                                `;
                            }).join('')}
                        </div>
                    </div>
                `;
                listContainer.appendChild(card);
            });
        }

        function animeKorish(telegramUrl, id) {
            let viewRef = db.ref('animes/' + id + '/views');
            viewRef.transaction(currentViews => (currentViews || 0) + 1);

            let monetagLink = 'https://omg10.com/4/11584274'; 
            window.open(monetagLink, '_blank');
            setTimeout(() => {
                window.location.href = telegramUrl;
            }, 1000);
        }

        function toggleLike(id) {
            let userLikedRef = db.ref('animes/' + id + '/likedUsers/' + currentUserId);
            userLikedRef.once('value', (snapshot) => {
                if (snapshot.val()) return; 
                userLikedRef.set(true);
                let likeRef = db.ref('animes/' + id + '/likes');
                likeRef.transaction(currentLikes => (currentLikes || 0) + 1);
            });
        }

        function toggleComments(id) {
            let section = document.getElementById(`comments_${id}`);
            section.classList.toggle('active');
        }

        function addComment(id) {
            let input = document.getElementById(`input_${id}`);
            let text = input.value.trim();
            if (!text) return;

            let commentsRef = db.ref('animes/' + id + '/comments');
            commentsRef.push({
                text: text,
                userId: currentUserId,
                userName: tg.initDataUnsafe?.user?.first_name || 'Foydalanuvchi'
            });
            input.value = '';
        }

        function deleteComment(animeId, commentKey) {
            db.ref('animes/' + animeId + '/comments/' + commentKey).remove();
        }

        function setGenre(genre, element) {
            selectedGenre = genre;
            document.querySelectorAll('.filter-chip').forEach(chip => chip.classList.remove('active'));
            element.classList.add('active');
            filterAnimes();
        }

        function filterAnimes() {
            let query = document.getElementById('searchInput').value.toLowerCase();
            
            let filtered = allAnimes.filter(anime => {
                let matchesSearch = anime.nomi.toLowerCase().includes(query) || anime.janri.toLowerCase().includes(query);
                let matchesGenre = selectedGenre === 'barchasi' || anime.janri.toLowerCase().includes(selectedGenre);
                return matchesSearch && matchesGenre;
            });

            displayAnimes(filtered);
        }

        loadAnime();
    </script>
</body>
</html>
