<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AniPix.Uz</title>
    <style>
        body {
            background-color: #0f0f0f;
            color: #ffffff;
            font-family: 'Arial', sans-serif;
            padding: 20px;
            margin: 0;
        }
        h2 {
            text-align: center;
            color: #00ffcc;
            margin-bottom: 15px;
        }
        .search-box {
            width: 100%;
            padding: 12px 15px;
            margin-bottom: 20px;
            background-color: #1a1a1a;
            border: 1px solid #333;
            border-radius: 8px;
            color: #fff;
            font-size: 15px;
            box-sizing: border-box;
            outline: none;
        }
        .search-box:focus {
            border-color: #0088cc;
        }
        .anime-card {
            background: #1a1a1a;
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 15px;
            border-left: 5px solid #0088cc;
        }
        .anime-card h3 {
            margin: 0 0 10px 0;
            color: #fff;
        }
        .anime-info {
            color: #aaa;
            font-size: 14px;
            margin-bottom: 15px;
        }
        .btn {
            display: block;
            width: 100%;
            background-color: #0088cc;
            color: white;
            text-align: center;
            padding: 12px;
            border-radius: 8px;
            text-decoration: none;
            font-weight: bold;
            border: none;
            cursor: pointer;
        }
        .btn:active {
            background-color: #006699;
        }
        .loading {
            text-align: center;
            color: #aaa;
            margin-top: 20px;
        }
    </style>
</head>
<body>

    <h2>🎬 AniPix.Uz</h2>

    <input type="text" id="searchInput" class="search-box" placeholder="Anime qidirish..." onkeyup="animeQidiruv()">

    <div id="animeList">
        <div class="loading">Ma'lumotlar yuklanmoqda...</div>
    </div>

    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script>
        let tg = window.Telegram.WebApp;
        tg.expand();

        const sheetUrl = 'https://docs.google.com/spreadsheets/d/11sQ6ue-cF8xzAqRSjaiyEJ-tnQj2kfg_wlD2PC7FiwA/export?format=csv';

        async function loadAnime() {
            try {
                let response = await fetch(sheetUrl);
                let data = await response.text();
                parseCSV(data);
            } catch (error) {
                document.getElementById('animeList').innerHTML = '<div class="loading" style="color:red;">Maʼlumotlarni yuklashda xatolik yuz berdi!</div>';
            }
        }

        function parseCSV(text) {
            let rows = text.split('\n');
            let listContainer = document.getElementById('animeList');
            listContainer.innerHTML = '';

            for (let i = 1; i < rows.length; i++) {
                let row = rows[i].trim();
                if (!row) continue;
                
                let cols = row.split(/,(?=(?:(?:[^"]*"){2})*[^"]*$)/);
                if (cols.length >= 4) {
                    let nomi = cols[0].replace(/^"(.*)"$/, '$1').trim();
                    let janri = cols[1].replace(/^"(.*)"$/, '$1').trim();
                    let tili = cols[2].replace(/^"(.*)"$/, '$1').trim(); // <--- Xatolik to'g'irlandi (cols[2] qilindi)
                    let havola = cols[3].replace(/^"(.*)"$/, '$1').trim();

                    if (nomi) {
                        let card = document.createElement('div');
                        card.className = 'anime-card';
                        card.innerHTML = `
                            <h3>${nomi}</h3>
                            <div class="anime-info">Janr: ${janri} <br> Til: ${tili}</div>
                            <button class="btn" onclick="animeKorish('${havola}')">Ko'rish</button>
                        `;
                        listContainer.appendChild(card);
                    }
                }
            }
        }

        function animeKorish(url) {
            alert("Reklama yuklanmoqda..."); 
            setTimeout(() => {
                window.open(url, '_blank');
            }, 1000);
        }

        function animeQidiruv() {
            let input = document.getElementById('searchInput').value.toLowerCase();
            let cards = document.getElementsByClassName('anime-card');

            for (let i = 0; i < cards.length; i++) {
                let title = cards[i].getElementsByTagName('h3')[0].innerText.toLowerCase();
                if (title.includes(input)) {
                    cards[i].style.display = "";
                } else {
                    cards[i].style.display = "none";
                }
            }
        }

        loadAnime();
    </script>
</body>
</html>
