        h2 {
            text-align: center;
            color: #00ffcc;
        }

        }

        .btn {

            color: white;
            text-align: center;
            padding: 12px;
            border-radius: 8px;
            text-decoration: none;
            font-weight: bold;
            margin-top: 10px;
            box-sizing: border-box;
        }
        .btn:active {
            opacity: 0.8;
