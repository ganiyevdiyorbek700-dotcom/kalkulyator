<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AniPix.Uz</title>
    <style>
        body {
            background-color: #0f0f0f;
            color: #ffffff;
            font-family: 'Arial', sans-serif;
            padding: 20px;
            margin: 0;
        }

        /* Loading Screen dizayni */
        #loading-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: #0f0f0f;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 9999;
            transition: opacity 0.5s ease;
        }
        .spinner {
            width: 50px;
            height: 50px;
            border: 4px solid rgba(0, 255, 204, 0.2);
            border-top: 4px solid #00ffcc;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-bottom: 20px;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        .load-title {
            color: #00ffcc;
            font-size: 24px;
            font-weight: bold;
            letter-spacing: 1px;
        }

        h2 {
            text-align: center;
            color: #00ffcc;
            margin-bottom: 15px;
        }
        .search-box {
            width: 100%;
            padding: 12px 15px;
            margin-bottom: 20px;
            background-color: #1a1a1a;
            border: 1px solid #333;
            border-radius: 8px;
            color: #fff;
            font-size: 15px;
            box-sizing: border-box;
            outline: none;
        }
        .search-box:focus {
            border-color: #0088cc;
        }
        
        /* Anime kartochkasi dizayni (Rasm bilan) */
        .anime-card {
            background: #1a1a1a;
            border-radius: 12px;
            padding: 15px;
            margin-bottom: 15px;
            border-left: 5px solid #0088cc;
            display: flex;
            gap: 15px;
            align-items: center;
        }
        .anime-poster {
            width: 80px;
            height: 110px;
            object-fit: cover;
            border-radius: 8px;
            background-color: #252525;
            flex-shrink: 0;
        }
        .anime-details {
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }
        .anime-card h3 {
            margin: 0 0 8px 0;
            color: #fff;
            font-size: 16px;
        }
        .anime-info {
            color: #aaa;
            font-size: 13px;
            margin-bottom: 10px;
        }
        .btn {
            display: block;
            width: 100%;
            background-color: #0088cc;
            color: white;
            text-align: center;
            padding: 10px;
            border-radius: 8px;
            text-decoration: none;
            font-weight: bold;
            border: none;
            cursor: pointer;
            font-size: 14px;
        }
        .btn:active {
            background-color: #006699;
        }
        .loading {
            text-align: center;
            color: #aaa;
            margin-top: 20px;
        }
    </style>
</head>
<body>

    <!-- 3 Soniyalik Loading Screen -->
    <div id="loading-screen">
        <div class="spinner"></div>
        <div class="load-title">🎬 AniPix.Uz</div>
    </div>

    <h2>🎬 AniPix.Uz</h2>

    <input type="text" id="searchInput" class="search-box" placeholder="Anime qidirish..." onkeyup="animeQidiruv()">

    <div id="animeList">
        <div class="loading">Ma'lumotlar yuklanmoqda...</div>
    </div>

    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script>
        let tg = window.Telegram.WebApp;
        tg.expand();

        // 3 soniyadan keyin Loading Screen'ni yashirish
        setTimeout(() => {
            let loader = document.getElementById('loading-screen');
            loader.style.opacity = '0';
            setTimeout(() => {
                loader.style.display = 'none';
            }, 500);
        }, 3000);

        const sheetUrl = 'https://docs.google.com/spreadsheets/d/11sQ6ue-cF8xzAqRSjaiyEJ-tnQj2kfg_wlD2PC7FiwA/export?format=csv';

        async function loadAnime() {
            try {
                let response = await fetch(sheetUrl);
                let data = await response.text();
                parseCSV(data);
            } catch (error) {
                document.getElementById('animeList').innerHTML = '<div class="loading" style="color:red;">Maʼlumotlarni yuklashda xatolik yuz berdi!</div>';
            }
        }

        // ... yuqoridagi qismlar o'zgarishsiz ...

        function parseCSV(text) {
            let rows = text.split('\n');
            let listContainer = document.getElementById('animeList');
            listContainer.innerHTML = '';

            for (let i = 1; i < rows.length; i++) {
                let row = rows[i].trim();
                if (!row) continue;
                
                let cols = row.split(/,(?=(?:(?:[^"]*"){2})*[^"]*$)/);
                
                // SHU YERNI 5 GA O'ZGARTIRING
                if (cols.length >= 5) { 
                    let nomi = cols[0] ? cols[0].replace(/^"(.*)"$/, '$1').trim() : '';
                    let janri = cols[1] ? cols[1].replace(/^"(.*)"$/, '$1').trim() : '';
                    let tili = cols[2] ? cols[2].replace(/^"(.*)"$/, '$1').trim() : '';
                    let havola = cols[3] ? cols[3].replace(/^"(.*)"$/, '$1').trim() : '';
                    let poster = cols[4] ? cols[4].replace(/^"(.*)"$/, '$1').trim() : 'https://via.placeholder.com/80x110?text=No+Image';

                    if (nomi) {
                        let card = document.createElement('div');
                        card.className = 'anime-card';
                        card.innerHTML = `
                            <img src="${poster}" alt="${nomi}" class="anime-poster" onerror="this.src='https://via.placeholder.com/80x110?text=AniPix'">
                            <div class="anime-details">
                                <div>
                                    <h3>${nomi}</h3>
                                    <div class="anime-info">Janr: ${janri} <br> Til: ${tili}</div>
                                </div>
                                <button class="btn" onclick="animeKorish('${havola}')">Ko'rish</button>
                            </div>
                        `;
                        listContainer.appendChild(card);
                    }
                }
            }
        }
// ... qolgan qismi o'zgarishsiz ...

        function animeKorish(telegramUrl) {
            let monetagLink = 'https://omg10.com/4/11584274'; 

            // 1. Reklamani yangi oynada ochish
            let adWindow = window.open(monetagLink, '_blank');
            
            // 2. 1 soniya kechiktirib kanalga/havolaga o'tish
            setTimeout(() => {
                window.location.href = telegramUrl;
            }, 1000);
        }

        function animeQidiruv() {
            let input = document.getElementById('searchInput').value.toLowerCase();
            let cards = document.getElementsByClassName('anime-card');

            for (let i = 0; i < cards.length; i++) {
                let title = cards[i].getElementsByTagName('h3')[0].innerText.toLowerCase();
                if (title.includes(input)) {
                    cards[i].style.display = "";
                } else {
                    cards[i].style.display = "none";
                }
            }
        }

        loadAnime();
    </script>
</body>
</html>
